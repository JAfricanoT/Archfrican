# Archfrican · fuzzel = the Spotlight surface (⌘+Space → archfrican-spotlight). Generated by theme-switch
# from the ADL tokens (do NOT edit by hand — colours in ./colors.ini, shape/spacing from tokens.defaults.sh).
# Frosted: the fill in colors.ini is translucent and niri's layer-blur sits behind the launcher.
[main]
font=${FONT_UI}:size=14,${FONT_MONO}:size=13
prompt="   "
icon-theme=${ICON_THEME}
icons-enabled=yes
width=46
lines=12
horizontal-pad=${SPACE_2XL}
vertical-pad=${SPACE_XL}
inner-pad=${SPACE_XL}
line-height=28
include=~/.config/fuzzel/colors.ini

[border]
width=${BORDER_WIDTH}
radius=${RADIUS_LG}

[dmenu]
exit-immediately-if-empty=yes

# Arrow keys wrap, matching Walker's selection_wrap=true. Without this the two launcher paths
# disagree: the same ↑ on the first entry loops in Walker and dead-stops in the fuzzel fallback,
# so the behaviour a user learns depends on whether Walker happens to be installed.
# fuzzel splits each direction into a non-wrapping and a wrapping action rather than offering a
# flag, so the arrows have to be moved from one to the other — binding them to both is a duplicate
# and fuzzel rejects the whole file. Tab is deliberately left alone: it belongs to execute-or-next.
[key-bindings]
prev=none
next=none
prev-with-wrap=Up Control+p ISO_Left_Tab
next-with-wrap=Down Control+n
