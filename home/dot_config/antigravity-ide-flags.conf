# Archfrican · native-Wayland flags for Antigravity IDE (Electron).
#
# WHY THIS FILE EXISTS. Without it Electron falls back to X11 (XWayland). That looks fine at
# scale 1, but XWayland has no concept of fractional output scale: under `scale 0.9` the
# compositor scales the window while the pointer coordinates it hands the client do not follow,
# so clicks land OFF-TARGET from where the cursor is drawn. Confirmed live — antigravity-ide held
# an open connection to BOTH wayland-1 and X11-unix/X0, while Vivaldi (native Wayland) held only
# the Wayland one and had no offset at the same scale.
#
# /usr/bin/antigravity-ide is a wrapper that sources $XDG_CONFIG_HOME/antigravity-ide-flags.conf
# (defaulting XDG_CONFIG_HOME to ~/.config), so dropping the flags here is the packaged, supported
# way in — no .desktop edit that a package upgrade would overwrite.
#
# Takes effect on the app's NEXT launch; a running instance keeps its current backend.
--ozone-platform-hint=auto
--enable-features=UseOzonePlatform,WaylandWindowDecorations
