# Archfrican · native-Wayland flags for VS Code / Code-OSS (Electron).
#
# Moved here from modules/30-dev.sh, which used to hand-write this one file with `cat >`. That left
# the repo shipping Wayland flags for exactly ONE of the six Chromium/Electron apps it can install
# (Code-OSS, Cursor, Antigravity, Vivaldi, Brave, Chromium) — the rest silently fell back to
# XWayland. Harmless at scale 1; under a fractional output scale XWayland desynchronises pointer
# coordinates from the drawn cursor, so clicks land off-target. As a chezmoi dotfile the whole set
# deploys declaratively and converges, instead of depending on one module having run.
--ozone-platform-hint=auto
--enable-features=UseOzonePlatform,WaylandWindowDecorations
