# Archfrican · native-Wayland flags for Cursor (Electron). Same rationale as
# antigravity-ide-flags.conf: on X11/XWayland a fractional output scale desynchronises pointer
# coordinates from the drawn cursor, so clicks land off-target. Deployed unconditionally — an
# unused flags file for an app you haven't installed is inert, and this way the app is correct the
# first time it is ever launched rather than after someone notices the offset.
--ozone-platform-hint=auto
--enable-features=UseOzonePlatform,WaylandWindowDecorations
